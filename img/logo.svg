<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 65" fill="none">
    <!-- Fundo sutil -->
    <rect width="220" height="65" rx="12" fill="#042747" opacity="0.08" />
    
    <!-- ========================================== -->
    <!-- PRÉDIO EM CONSTRUÇÃO COM GUINDASTE        -->
    <!-- ========================================== -->
    
    <!-- Prédio principal -->
    <rect x="6" y="16" width="32" height="40" rx="2" fill="#ffcc00" opacity="0.95" />
    
    <!-- Janelas -->
    <rect x="10" y="20" width="8" height="6" rx="1" fill="#042747" opacity="0.25" />
    <rect x="22" y="20" width="10" height="6" rx="1" fill="#042747" opacity="0.25" />
    <rect x="10" y="30" width="8" height="6" rx="1" fill="#042747" opacity="0.25" />
    <rect x="22" y="30" width="10" height="6" rx="1" fill="#042747" opacity="0.25" />
    <rect x="10" y="40" width="8" height="6" rx="1" fill="#042747" opacity="0.25" />
    <rect x="22" y="40" width="10" height="6" rx="1" fill="#042747" opacity="0.25" />
    <rect x="10" y="50" width="8" height="4" rx="1" fill="#042747" opacity="0.25" />
    <rect x="22" y="50" width="10" height="4" rx="1" fill="#042747" opacity="0.25" />
    
    <!-- Andar superior em construção -->
    <rect x="6" y="8" width="32" height="10" rx="1" fill="#ffcc00" opacity="0.35" stroke="#ffcc00" stroke-width="1.5" stroke-dasharray="3 3" />
    <rect x="10" y="10" width="8" height="4" rx="1" fill="#042747" opacity="0.12" />
    <rect x="22" y="10" width="10" height="4" rx="1" fill="#042747" opacity="0.12" />
    
    <!-- Estrutura do telhado -->
    <path d="M4 8 L22 0 L40 8" stroke="#ffcc00" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- GUINDASTE -->
    <!-- Base -->
    <rect x="42" y="44" width="10" height="12" rx="1" fill="#ffcc00" opacity="0.7" />
    
    <!-- Torre vertical -->
    <line x1="47" y1="44" x2="47" y2="6" stroke="#ffcc00" stroke-width="3.5" stroke-linecap="round" />
    
    <!-- Lança horizontal -->
    <line x1="20" y1="6" x2="80" y2="6" stroke="#ffcc00" stroke-width="3.5" stroke-linecap="round" />
    
    <!-- Lança superior (detalhe) -->
    <line x1="22" y1="2" x2="76" y2="2" stroke="#ffcc00" stroke-width="1.5" opacity="0.3" />
    
    <!-- Contrapeso -->
    <rect x="70" y="6" width="10" height="7" rx="1" fill="#ffcc00" opacity="0.4" />
    
    <!-- Cabo principal -->
    <line x1="50" y1="6" x2="50" y2="18" stroke="#fcfefc" stroke-width="2" stroke-dasharray="3 2" />
    
    <!-- Cabo secundário -->
    <line x1="50" y1="6" x2="62" y2="6" stroke="#fcfefc" stroke-width="1.5" stroke-dasharray="2 2" />
    
    <!-- Gancho -->
    <path d="M50 18 L50 22 Q50 26 46 26 L54 26 Q58 26 58 22 L58 18" stroke="#fcfefc" stroke-width="2" fill="none" stroke-linecap="round" />
    <rect x="46" y="26" width="8" height="4" rx="1" fill="#ffcc00" opacity="0.5" />
    
    <!-- Detalhes do guindaste -->
    <circle cx="47" cy="6" r="4" fill="#ffcc00" opacity="0.25" />
    <line x1="28" y1="6" x2="28" y2="14" stroke="#ffcc00" stroke-width="2" opacity="0.3" />
    <line x1="34" y1="6" x2="34" y2="14" stroke="#ffcc00" stroke-width="2" opacity="0.3" />
    
    <!-- NUVEM / POEIRA (efeito de construção) -->
    <circle cx="85" cy="20" r="6" fill="#fcfefc" opacity="0.06" />
    <circle cx="92" cy="16" r="8" fill="#fcfefc" opacity="0.04" />
    <circle cx="88" cy="28" r="5" fill="#fcfefc" opacity="0.05" />
    
    <!-- NOME ALTO NÍVEL -->
    <text x="6" y="63" font-family="Inter, sans-serif" font-weight="900" font-size="15" fill="#fcfefc" letter-spacing="2.5">ALTO NÍVEL</text>
</svg>