<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" fill="none">
    <!-- Fundo sutil -->
    <rect width="320" height="280" rx="40" fill="#042747" opacity="0.04" />
    
    <!-- Capacete de engenheiro -->
    <g transform="translate(40, 30)">
        <path d="M20 40 C20 10 100 10 100 40 L100 60 L20 60 L20 40Z" stroke="#ffcc00" stroke-width="4.5" fill="none" stroke-linejoin="round" />
        <rect x="40" y="60" width="40" height="16" rx="4" fill="#ffcc00" opacity="0.5" />
        <circle cx="60" cy="34" r="12" stroke="#fcfefc" stroke-width="3" fill="none" />
        <path d="M54 28 L66 40 M66 28 L54 40" stroke="#fcfefc" stroke-width="2.5" stroke-linecap="round" opacity="0.5" />
    </g>
    
    <!-- Esquadro grande -->
    <g transform="translate(30, 140)">
        <path d="M0 0 L0 60 L50 60" stroke="#ffcc00" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <path d="M20 20 L20 45 L45 45" stroke="#fcfefc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.4" />
        <text x="10" y="50" font-size="10" fill="#ffcc00" opacity="0.5">90°</text>
    </g>
    
    <!-- Régua -->
    <g transform="translate(210, 100)">
        <rect x="0" y="0" width="14" height="90" rx="2" fill="#ffcc00" opacity="0.8" />
        <line x1="7" y1="12" x2="7" y2="82" stroke="#042747" stroke-width="2" stroke-dasharray="4 6" opacity="0.6" />
        <line x1="3" y1="20" x2="3" y2="30" stroke="#042747" stroke-width="1.5" opacity="0.4" />
        <line x1="11" y1="20" x2="11" y2="30" stroke="#042747" stroke-width="1.5" opacity="0.4" />
    </g>
    
    <!-- Nível de bolha -->
    <g transform="translate(170, 200)">
        <rect x="0" y="0" width="80" height="14" rx="3" fill="#ffcc00" opacity="0.2" stroke="#ffcc00" stroke-width="1.5" />
        <circle cx="40" cy="7" r="4" fill="#ffcc00" opacity="0.6" />
        <line x1="25" y1="7" x2="55" y2="7" stroke="#ffcc00" stroke-width="2" opacity="0.4" />
    </g>
    
    <!-- Estrela destaque -->
    <text x="260" y="50" font-size="36" opacity="0.15">★</text>
    
    <!-- Ícones de construção -->
    <text x="20" y="30" font-size="22" opacity="0.10">🏗️</text>
    <text x="270" y="260" font-size="28" opacity="0.08">🔨</text>
    <text x="10" y="270" font-size="24" opacity="0.08">📐</text>
</svg>